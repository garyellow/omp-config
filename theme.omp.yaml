version: 4
auto_upgrade: true
shell_integration: true
final_space: true
console_title_template: "{{ .Shell }} in {{ .PWD }}{{if .Root}} (root){{end}}"
blocks:
  - type: prompt
    alignment: left
    newline: true
    segments:
      - type: shell
        style: diamond
        leading_diamond: ╭─
        foreground: "#ffffff"
        background: "#0077cc"
        template: "{{ .Name }} "
        options:
          mapped_shell_names:
            bash:  bash
            cmd:  cmd
            pwsh:  pwsh
            zsh:  zsh
      - type: root
        style: powerline
        powerline_symbol: 
        foreground: "#fffb38"
        background: "#ee5656"
        template: "  "
      - type: path
        style: powerline
        powerline_symbol: 
        foreground: "#2d3436"
        background: "#f89350"
        template: "  {{ path .Path .PWD }} "
        options:
          folder_icon: "  "
          home_icon: 
          mixed_threshold: 10
          style: mixed
      - type: git
        style: powerline
        powerline_symbol: 
        foreground: "#193549"
        background: "#ffeb3b"
        background_templates:
         - "{{ if or (.Working.Changed) (.Staging.Changed) }}#FFEB3B{{ end }}"
         - "{{ if and (gt .Ahead 0) (gt .Behind 0) }}#FFCC80{{ end }}"
         - "{{ if gt .Ahead 0 }}#B388FF{{ end }}"
         - "{{ if gt .Behind 0 }}#B388FB{{ end }}"
        template: "{{ url .UpstreamIcon .UpstreamURL }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus
          }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and
          (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} 
          {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{
          end }}"
        options:
          branch_icon: " "
      - type: docker
        style: powerline
        powerline_symbol: 
        foreground: "#ffffff"
        background: "#0b59e7"
        template: "  {{ .Context }} "
        options:
          display_mode: environment
          docker_command: docker
      - type: executiontime
        style: diamond
        trailing_diamond: 
        background: "#83769c"
        foreground: "#ffffff"
        template: "  {{ .FormattedMs }}"
        options:
          always_enabled: true
          style: roundrock
  - type: prompt
    alignment: right
    segments:
      - type: node
        style: diamond
        leading_diamond: 
        trailing_diamond: " "
        foreground: "#ffffff"
        background: "#6ca35e"
        options:
          fetch_package_manager: true
        template:  {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{
          .Full }}
      - type: python
        style: diamond
        leading_diamond: 
        trailing_diamond: " "
        foreground: "#ffd43b"
        background: "#306998"
        template:  {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{
          end }}{{ .Full }}{{ end }}
      - type: java
        style: diamond
        leading_diamond: 
        trailing_diamond: " "
        foreground: "#ffffff"
        background: "#4063D8"
        template:  {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}
      - type: go
        style: diamond
        leading_diamond: 
        trailing_diamond: " "
        foreground: "#ffffff"
        background: "#7FD5EA"
        template: "  {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}"
      - type: rust
        style: diamond
        leading_diamond: 
        trailing_diamond: " "
        foreground: "#193549"
        background: "#99908a"
        template:  {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}
      - type: os
        style: diamond
        invert_powerline: true
        leading_diamond: 
        foreground: "#26C6DA"
        background: "#546E7A"
        options:
          linux: 
          macos: 
          windows: 
        template: "{{ if .WSL }}WSL at {{ end }}{{.Icon}} "
      - type: battery
        style: powerline
        powerline_symbol: 
        invert_powerline: true
        foreground: "#262626"
        background: "#f36943"
        background_templates:
          - '{{if eq "Charging" .State.String}}#b8e994{{end}}'
          - '{{if eq "Discharging" .State.String}}#fff34e{{end}}'
          - '{{if eq "Full" .State.String}}#33DD2D{{end}}'
        template: " {{ if not .Error }}{{ .Icon }}{{ .Percentage }}{{ end }} {{ .Error }}"
        options:
          charged_icon: " "
          charging_icon: " "
          discharging_icon: " "
      - type: time
        style: diamond
        invert_powerline: true
        trailing_diamond: 
        foreground: "#ffffff"
        background: "#06a428"
        template: "  {{ .CurrentDate | date .Format }} "
  - type: prompt
    alignment: left
    newline: true
    segments:
      - type: text
        style: plain
        foreground: "#0077cc"
        template: ╰─
      - type: status
        style: plain
        foreground: "#e0f8ff"
        foreground_templates:
          - "{{ if gt .Code 0 }}#ef5350{{ end }}"
        template: 
        options:
          always_enabled: true
transient_prompt:
  foreground: "#ffffff"
  background: transparent
  template: "{{ .Shell }}> "
